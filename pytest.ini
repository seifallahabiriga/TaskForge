[pytest]
asyncio_mode = auto

# Custom markers — keeps pytest from warning about unknown markers.
markers =
    e2e: End-to-end tests that require a live Celery worker and ML provider keys.
         These are slow and should be skipped in fast feedback loops with -m "not e2e".

# Show short tracebacks by default — full ones on failure.
addopts = --tb=short

# Test discovery.
testpaths = backend/tests