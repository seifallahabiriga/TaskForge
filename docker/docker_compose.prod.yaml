version: "3.9"

services:

  # ------------------------------------------------------------------ #
  # PostgreSQL                                                           #
  # ------------------------------------------------------------------ #
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  # Redis                                                                #
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  # FastAPI — no reload, no volume mount, gunicorn                      #
  # ------------------------------------------------------------------ #
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      gunicorn backend.main:app
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ------------------------------------------------------------------ #
  # Celery worker — no volume mount, concurrency tuned for prod         #
  # ------------------------------------------------------------------ #
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      celery -A backend.queue.celery_app worker
      --loglevel=warning
      --concurrency=4
      --max-tasks-per-child=100
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ------------------------------------------------------------------ #
  # Alembic migrations — runs once then exits                           #
  # ------------------------------------------------------------------ #
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: alembic upgrade head
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data: