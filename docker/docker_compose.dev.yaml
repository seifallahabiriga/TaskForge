version: "3.9"

services:

  # ------------------------------------------------------------------ #
  # PostgreSQL                                                           #
  # ------------------------------------------------------------------ #
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  # Redis                                                                #
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redisdev}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redisdev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------ #
  # FastAPI                                                              #
  # ------------------------------------------------------------------ #
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Celery worker                                                        #
  # ------------------------------------------------------------------ #
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A backend.queue.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Celery beat (optional — for scheduled tasks later)                  #
  # ------------------------------------------------------------------ #
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A backend.queue.celery_app beat --loglevel=info
    volumes:
      - ..:/app
    env_file:
      - ../.env
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - beat

volumes:
  postgres_data: